name: CI Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v3

    - name: Simular build Docker
      run: echo "Docker build ejecutado correctamente"

    - name: Simular pruebas unitarias
      run: echo "Pruebas unitarias ejecutadas con éxito"

    - name: Análisis de calidad
      run: echo "SonarQube Quality Gate Passed"

    - name: Despliegue simulado
      run: echo "Despliegue continuo ejecutado"
